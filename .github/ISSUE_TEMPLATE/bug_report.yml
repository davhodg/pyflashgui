name: Bug report
description: Something in pyflashgui does not work the way the manual says it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected to happen, and what happened instead. Quote any message pyflashgui showed word for word.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps from starting pyflashgui to the problem, one per line, in order. Say if it happens every time or only sometimes.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste the diagnostics report here. In pyflashgui, open *Help > Diagnostics...*, press **Copy**, and paste it into this box.
        The report gives the versions of pyflashgui, Python, PySide6, pyOCD and what came with them, the platform, the connection, the last operations and what pyOCD said about them. It names the probes' serial numbers, your workspace folder and the files in the Files pane; remove any of that if you would rather.
        If pyflashgui will not start at all, say so, and paste whatever it printed instead.
      render: text

  - type: dropdown
    id: through
    attributes:
      label: Using
      description: What is chosen under Using in the bar across the top.
      options:
        - pyOCD
        - J-Link Commander
        - Simulated
    validations:
      required: true

  - type: input
    id: probe
    attributes:
      label: Probe
      description: The make and model of the debug probe, or the name of the board it is built into. Its serial number is not needed.

  - type: input
    id: target
    attributes:
      label: Target
      description: The name chosen under Target, as it is spelt there, and the part number of the device itself if that is different.

  - type: dropdown
    id: installed
    attributes:
      label: Installed with
      options:
        - The Windows installer
        - The launcher (pyflashgui.cmd or pyflashgui.sh)
        - pip
        - A source checkout, for development
    validations:
      required: true

  - type: textarea
    id: event-log
    attributes:
      label: Event Log
      description: What the Event Log said around the time -- warnings and errors especially. A traceback is worth more than any description of one.
      render: text
