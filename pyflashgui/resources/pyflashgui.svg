<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- SPDX-FileCopyrightText: 2026 davhodg -->
<!-- pyflashgui icon, 32 px and up: a chip with four pins a side and a flash
     across it. Below 32 px four pins a side blur into a fringe, so
     pyflashgui_small.svg draws two heavier ones. build/icon.py renders both
     into pyflashgui.ico and pyflashgui.png. -->
<rect x="0" y="0" width="256" height="256" rx="40" fill="#151b1d"/>
<!-- pins, drawn first so the body's outline covers their inner ends -->
<g stroke="#2FD9C4" stroke-width="12" stroke-linecap="round">
<line x1="38" y1="89" x2="70" y2="89"/>
<line x1="38" y1="115" x2="70" y2="115"/>
<line x1="38" y1="141" x2="70" y2="141"/>
<line x1="38" y1="167" x2="70" y2="167"/>
<line x1="186" y1="89" x2="218" y2="89"/>
<line x1="186" y1="115" x2="218" y2="115"/>
<line x1="186" y1="141" x2="218" y2="141"/>
<line x1="186" y1="167" x2="218" y2="167"/>
<line x1="89" y1="38" x2="89" y2="70"/>
<line x1="115" y1="38" x2="115" y2="70"/>
<line x1="141" y1="38" x2="141" y2="70"/>
<line x1="167" y1="38" x2="167" y2="70"/>
<line x1="89" y1="186" x2="89" y2="218"/>
<line x1="115" y1="186" x2="115" y2="218"/>
<line x1="141" y1="186" x2="141" y2="218"/>
<line x1="167" y1="186" x2="167" y2="218"/>
</g>
<!-- the body: outlined rather than filled, so the flash has the dark behind it -->
<rect x="68" y="68" width="120" height="120" rx="14" fill="#151b1d" stroke="#EDEAE2" stroke-width="12"/>
<!-- the flash -->
<path d="M140,84 L100,134 H124 L114,172 L156,120 H131 Z" fill="#F2924B"/>
</svg>
